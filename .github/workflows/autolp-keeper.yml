name: Automated LP keeper
# Hourly "autopilot" for the HOODX Automated LP vault (V2). Every action is a permissionless, rule-bound crank on
# HoodxStockLpControllerV2: the contracts decide whether a rebalance/compound is allowed and how much to move, so
# the keeper key only pays gas and cannot move vault funds. Each transaction is simulated first.
# Secrets: ROBINHOOD_RPC_URL (read/write RPC), AUTOLP_KEEPER_PRIVATE_KEY (gas-only keeper wallet).
on:
  schedule:
    - cron: "7 * * * *" # hourly; the contracts tolerate up to a 2 h gap between breach checks
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autolp-keeper
  cancel-in-progress: false
jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/stock-lp-vault
          fetch-depth: 1
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.3
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run keeper
        env:
          ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
          AUTOLP_KEEPER_PRIVATE_KEY: ${{ secrets.AUTOLP_KEEPER_PRIVATE_KEY }}
          PYTHONUTF8: "1"
        run: python scripts/stock_lp_keeper.py --private-key-env AUTOLP_KEEPER_PRIVATE_KEY --stateless
